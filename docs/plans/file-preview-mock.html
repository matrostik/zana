<!doctype html><meta charset="utf-8"><title>File preview proposal</title>
<style>body{font:15px system-ui;background:#17191d;color:#e5e7eb;margin:30px}button{font:inherit;background:#30343c;color:inherit;border:1px solid #555;border-radius:6px;padding:8px;cursor:pointer}main{display:flex;gap:24px;margin-top:24px}section{background:#202329;padding:24px;flex:1;border:1px solid #41454d;border-radius:8px}code{color:#e5bf72}#choices button{display:block;margin:8px 0}small{color:#b0b6c2}</style>
<h2>File preview · interactive mock</h2><small>Simulated files, no host access. Try duplicate selection and generating a missing report.</small>
<p><button onclick="current=!current;this.textContent=current?'Current':'Proposed';reset()">Proposed</button></p>
<main><section><p>The guides are <button onclick="choose()"><code>guide.md</code></button>.</p><div id="choices"></div><button onclick="missing()">Open output/review-report.md</button></section><section id="preview">Click a file to preview it.</section></main>
<script>let current=false,generated=false;function reset(){choices.innerHTML='';preview.textContent='Click a file to preview it.'}function choose(){if(current){preview.textContent='Could not open this file: file not found';return}choices.innerHTML='<p>Choose a file</p>';for(const path of ['docs/guide.md','examples/guide.md']){let b=document.createElement('button');b.textContent=path;b.onclick=()=>{preview.textContent=path+' — Guide content';choices.innerHTML=''};choices.append(b)}}function missing(){preview.innerHTML=generated?'# Review report — Generated content':current?'Could not open this file: file not found':'<h3>Could not open output/review-report.md</h3><p>File not found or unavailable in the authorized project.</p><p>Tried: D:/project/output/review-report.md</p><p>If another step generates this file, run that step, then try again.</p><button onclick="generated=true;this.textContent=\'Generated (simulation)\'">Generate report (mock)</button> <button onclick="missing()">Try again</button>'}</script>
